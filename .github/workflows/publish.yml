name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'open-agenthub/n8n-nodes-openagenthub' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Require reviewed main commit
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require npm OIDC support
        run: node -e 'const [major, minor, patch] = require("node:child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm >=11.5.1 required")'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== `v${require("./package.json").version}`) throw new Error("Release tag must match package version")'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm publish --access public --provenance --ignore-scripts
